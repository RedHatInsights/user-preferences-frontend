extends:
  - '@redhat-cloud-services/eslint-config-redhat-cloud-services'
globals:
  insights: writable
rules:
  no-unused-vars:
    - warn
    - ignoreRestSiblings: true
      argsIgnorePattern: '^_'
  prettier/prettier:
    - error
    - singleQuote: true
  sort-imports:
    - error
    - ignoreDeclarationSort: true
overrides:
  - files:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
    parser: '@typescript-eslint/parser'
    plugins:
      - '@typescript-eslint'
    parserOptions:
      ecmaVersion: 2022
      sourceType: module
      ecmaFeatures:
        jsx: true
    rules:
      no-undef: 'off'

  - files:
      - 'src/**/*.{js,jsx,ts,tsx}'
    parser: '@typescript-eslint/parser'
    plugins:
      - '@typescript-eslint'
      - i18next
    parserOptions:
      ecmaVersion: 2022
      sourceType: module
      ecmaFeatures:
        jsx: true
    excludedFiles:
      - 'src/**/*.test.*'
      - 'src/**/*.stories.*'
      - 'src/__mocks__/**'
    rules:
      i18next/no-literal-string:
        - error
        - mode: jsx-only
          words:
            exclude:
              - '/^alignItems[A-Z]/'
              - '/^spaceItems[A-Z]/'
              - '/^justifyContent[A-Z]/'
              - '/^flexWrap[A-Z]/'
              - '/^inset[A-Z]/'
              - '/^spacer[A-Z]/'
              - '/^gap[A-Z]/'
              - '/^flex_[0-9]+$/'
              - '/^flexDefault$/'
              - '/^flexNone$/'
              - '/^grow$/'
              - '/^shrink$/'
              - '/^noPadding$/'
              - '/^nowrap$/'
              - '/^compact$/'
              - '/^100%$/'
              - '/^calc\(/'
              - '/^var\(/'
              - '/^\d+px$/'
              - 'color'
              - 'status'
              - 'locale'
              - 'defaultLocale'
              - 'titleIconVariant'
              - 'iconVariant'
              - 'placeholder'
              - 'eventKey'
              - 'serviceName'
              - 'validated'
              - 'rel'
              - 'role'
              - 'popperProps'
              - 'appendTo'
              - 'none'
              - 'polite'
              - 'off'
              - '/^right$/'
              - '/^left$/'
              - '/^center$/'
              - '/^top$/'
              - '/^bottom$/'
              - '/^danger$/'
              - '/^success$/'
              - '/^warning$/'
              - '/^info$/'
              - '/^default$/'
              - '/^pending$/'
              - '/^approved$/'
              - '/^denied$/'
              - '/^create$/'
              - '/^edit$/'
              - '/^cancel$/'
              - '/^_blank$/'
              - '/^noopener$/'
              - '/^hover$/'
              - '/^click$/'
              - '/^single$/'
              - '/^multiple$/'
              - '/^openshift$/'
              - '/^aws$/'
              - '/^azure$/'
              - '/^google$/'
              - '/^, $/'
              - '/^: $/'
              - '/^a$/'
              - '/^#$/'
              - '/^loading$/'
              - '/^empty$/'
              - '/^expanded$/'
              - '/^collapsed$/'
              - '/^selected$/'
              - '/^not selected$/'
          jsx-attributes:
            exclude:
              - 'className'
              - 'styleName'
              - 'style'
              - 'type'
              - 'key'
              - 'id'
              - 'width'
              - 'height'
              - 'name'
              - 'href'
              - 'to'
              - 'path'
              - 'target'
              - 'variant'
              - 'component'
              - 'form'
              - 'fieldId'
              - 'filterId'
              - 'widgetId'
              - 'ouiaId'
              - 'data-testid'
              - 'testId'
              - 'autoFocus'
              - 'headingLevel'
              - 'size'
              - 'sx'
              - 'direction'
              - 'position'
              - 'align'
              - 'icon'
              - 'variantPrefix'
              - 'isCompact'
              - 'color'
              - 'status'
              - 'locale'
              - 'defaultLocale'
              - 'aria-describedby'
              - 'aria-labelledby'
              - 'titleIconVariant'
              - 'iconVariant'
              - 'placeholder'
              - 'eventKey'
              - 'labelId'
              - 'serviceName'
              - 'sortableColumns'
              - 'validated'
              - 'rel'
              - 'role'
              - 'popperProps'
              - 'appendTo'
              - 'dataLabel'
              - 'expandId'
              - 'titleId'
              - 'apiPath'
              - 'data-ouia-component-id'
              - 'data-ouia-component-type'
              - 'aria-controls'
              - 'autoComplete'
              - 'breakpoint'
              - 'wrapModifier'
              - 'data-type'
              - 'currency'
              - 'dateFormat'
          callees:
            exclude:
              - 'join'
